<script>
/* ── Supabase Backend Connection ── */
const SUPABASE_URL = 'https://wrikxgglpabvtcsvopwc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RqgsPBhoiaP7Dhq5lSeImQ_nqwHCXfP';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function renderUserHeader() {
  const h = document.getElementById('userHeader');
  if (!h) return;
  const user = JSON.parse(localStorage.getItem('bb_user') || 'null');
  if (user && (user.name || user.email)) {
    const name = user.name || user.full_name || user.email.split('@')[0];
    const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    ME.name = name;
    if (user.phone) ME.ph = user.phone;
    if (user.locality) ME.blk = user.locality;
    h.innerHTML = `
      <div id="userPill" style="display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:99px;cursor:pointer" title="View & edit account">

}

// Sync session from Supabase on load (handles OAuth callback redirect too)
(async () => {
  if (!sb) return;
  try {
    // Handle OAuth callback: Supabase sets the session from URL hash/code automatically
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      let prof = null;
      try {
        const { data: p } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        if (p) prof = p;
      } catch (e) {}

      // If no profile row yet (new OAuth user), create one
      if (!prof) {
        const meta = session.user.user_metadata || {};
        const fullName = meta.full_name || meta.name || session.user.email?.split('@')[0] || 'User';
        try {
          await sb.from('profiles').upsert({
            id: session.user.id,
            full_name: fullName,
            email: session.user.email,
            phone: meta.phone || '',
            locality: meta.locality || 'My Society',
            created_at: new Date().toISOString()
          });
          prof = { full_name: fullName, email: session.user.email, phone: '', locality: 'My Society' };
        } catch (e) {}
      }

      const meta = session.user.user_metadata || {};
      const u = {
        id: session.user.id,
        name: prof?.full_name || meta.full_name || meta.name || session.user.email?.split('@')[0],
        full_name: prof?.full_name || meta.full_name || '',
        email: session.user.email,
        phone: prof?.phone || meta.phone || '',
        locality: prof?.locality || meta.locality || ''
      };
      localStorage.setItem('bb_user', JSON.stringify(u));
      renderUserHeader();

      // Clean up the OAuth hash from the URL without reloading
      if (window.location.hash.includes('access_token') || window.location.search.includes('code=')) {
        history.replaceState(null, '', window.location.pathname);
      }
    }
  } catch (e) { console.warn('Session sync:', e); }
})();

async function saveItemToSupabase(item) {
  if (!sb) return;
  try { await sb.from('items').upsert([item]); } catch (err) { console.warn('Supabase items save:', err); }
}

async function saveLoanToSupabase(loan) {
  if (!sb) return;
  try { await sb.from('loans').upsert([loan]); } catch (err) { console.warn('Supabase loans save:', err); }
}

async function updateLoanInSupabase(loan) {
  if (!sb) return;
  try { await sb.from('loans').upsert([loan]); } catch (err) { console.warn('Supabase loans update:', err); }
}

async function saveReviewToSupabase(rev) {
  if (!sb) return;
  try { await sb.from('reviews').insert([rev]); } catch (err) { console.warn('Supabase reviews save:', err); }
}

async function loadFromSupabase() {
  if (!sb) return;
  try {
    const [itemsRes, loansRes, revsRes] = await Promise.allSettled([
      sb.from('items').select('*'),
      sb.from('loans').select('*'),
      sb.from('reviews').select('*')
    ]);
    let changed = false;
    if (itemsRes.status === 'fulfilled' && itemsRes.value.data?.length) {
      itemsRes.value.data.forEach(ri => {
        if (!st.items.some(li => li.id === ri.id)) { st.items.push(ri); changed = true; }
      });
    }
    if (loansRes.status === 'fulfilled' && loansRes.value.data?.length) {
      loansRes.value.data.forEach(rl => {
        if (!st.loans.some(ll => ll.id === rl.id)) { st.loans.push(rl); changed = true; }
      });
    }
    if (revsRes.status === 'fulfilled' && revsRes.value.data?.length) {
      st.revs = st.revs || [];
      revsRes.value.data.forEach(rr => {
        if (!st.revs.some(lr => lr.item === rr.item && lr.t === rr.t && lr.d === rr.d)) { st.revs.push(rr); changed = true; }
      });
    }
    if (changed) { save(); render(); }
  } catch (err) { console.warn('Supabase initial fetch:', err); }
}

return{t:`${l.e-TODAY} day${l.e-TODAY>1?'s':''} left`,c:'ok',p:Math.round((TODAY-l.s+1)/(l.e-l.s+1)*100)}}
function renderLoans(){const ls=[...st.loans].sort((a,b)=>(a.ret?1:0)-(b.ret?1:0)||a.e-b.e);
$('#main').innerHTML=`<section class="sec"><h2>My borrowing</h2><p class="meta">Every request shows its dates, time left, and return status.</p>${loanStats()}${ls.length?ls.map(l=>{const it=allItems().find(i=>i.id===l.item),n=nbr(it.o),f=loanInfo(l);return `<div class="card loan"><div class="row"><div><h3>${it.e} ${esc(it.name)}</h3><div class="meta">From ${esc(n.name)}, ${esc(n.blk)}${l.occ?' · for '+esc(l.occ):''}</div></div><span class="st ${f.c}">${f.t}</span></div><div class="meta">${fmt(l.s)} to ${fmt(l.e)} · ${l.e-l.s+1} day${l.e>l.s?'s':''}${l.amt==null?'':' · '+'₹'+l.amt}</div><div class="bar ${f.late?'late':''}"><i style="width:${f.p}%"></i></div>${l.ret?'':`<div class="row" style="justify-content:flex-start"><button class="btn sm" data-r="${l.id}">Mark as returned</button><button class="btn sm alt" data-x="${l.id}">Extend by 1 day</button><button class="btn sm alt" data-c="${l.id}">${TODAY<l.s?'Cancel':'Cancel'}</button></div>`}</div>`}).join(''):'<div class="empty">You haven’t borrowed anything yet. Pick an item from Browse and choose your dates.</div>'}</section>`;
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const l=st.loans.find(x=>x.id==b.dataset.r);openReturn(l)});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.loans=st.loans.filter(x=>x.id!=b.dataset.c);save();toast('Request cancelled');render()});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const l=st.loans.find(x=>x.id==b.dataset.x),it=allItems().find(i=>i.id===l.item);
if(l.e-l.s+1>=it.max)return toast(`${it.name} can be borrowed for ${it.max} days at most`);
const sv=l.e;l.ret=0;const bk=isBooked(it,sv+1);l.ret=undefined;
if(bk)return toast('Someone else has booked the next day');l.e++;if(l.amt!=null&&!it.hrs)l.amt+=price(it);save();toast('Extended to '+fmt(l.e));render()})}
function renderLend(){const mine=st.items;
$('#main').innerHTML=`<section class="sec"><h2>Lend an item</h2><p class="meta">Share something you rarely use. Neighbours will see it on the Browse page.</p><form class="f" id="lf" onsubmit="return false"><label>Item name<input id="ln" required maxlength="50" placeholder="e.g. Folding tables"></label><label>Emoji (shown if there is no photo)<input id="le" maxlength="4" value="📦"></label><label>Photo of your item<input id="lp" type="file" accept="image/*"></label><label>Longest loan (days)<input id="lm" type="number" min="1" max="14" value="3"></label><label>Price per day in ₹<input id="lq" type="number" min="10" max="5000" value="100"></label><label>Short description<textarea id="ld" rows="2" maxlength="140" placeholder="Condition, size, anything to know"></textarea></label><div>Good for these occasions</div><div class="oc">${OCC.map(o=>`<label><input type="checkbox" value="${o}" style="width:auto"> ${o}</label>`).join('')}</div><button class="btn" id="la">Add to my items</button></form>
<h3 style="margin:30px 0 12px">Items you’re lending (${mine.length})</h3>${mine.length?`<div class="grid">${mine.map(itemCard).join('')}</div>`:'<div class="empty">You haven’t listed anything yet.</div>'}</section>`;
$('#la').onclick=async()=>{
  const name=$('#ln').value.trim();if(!name)return toast('Enter an item name first');const img=await readImg($('#lp').files[0]);
  const oc=[...document.querySelectorAll('.oc input:checked')].map(i=>i.value);
  const newItem = {id:100+Date.now()%1e7,o:0,name,e:$('#le').value||'📦',occ:oc.length?oc:['Festival'],max:Math.max(1,Math.min(14,+$('#lm').value||3)),d:$('#ld').value||'Ask me for details.',bk:[],img,p:Math.max(10,+$('#lq').value||100)};
  st.items.push(newItem);
  save();
  saveItemToSupabase(newItem);
  if(window.BB_TRACK)BB_TRACK('LEND_ITEM',{itemName:newItem.name,price:newItem.p,occ:newItem.occ});
  toast('Added. Neighbours can now request it.');
  render()
};
document.querySelectorAll('.card[data-i]').forEach(c=>c.onclick=()=>openItem(+c.dataset.i))}
/* modal + calendar */
let cur=null,cm=0,cy=0,sel=[];
function openProfileModal(){
  const user = JSON.parse(localStorage.getItem('bb_user') || '{}');
  const name = user.name || user.full_name || ME.name || '';
  const email = user.email || '';
  const phone = user.phone || ME.ph || '';
  const locality = user.locality || ME.blk || '';
  
  $('#modal').innerHTML = `
    <div class="mh" style="border-bottom:1px solid var(--line);padding:20px 24px">
      <div style="display:flex;align-items:center;gap:12px">
        <span class="av" style="background:#1f8a70;width:52px;height:52px;font-size:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700">${esc(name.slice(0,2).toUpperCase())}</span>
        <div>
          <h2>${esc(name)}</h2>
          <div class="meta" style="margin-top:4px">${esc(locality || 'Verified Resident')}</div>
        </div>
      </div>
      <button class="x" aria-label="Close">×</button>
    </div>
    <div style="padding:22px;display:grid;gap:14px">
      <div class="f" style="max-width:none">
        <label>Full Name
          <input id="profName" value="${esc(name)}">
        </label>
        <label>Email Address
          <input value="${esc(email)}" disabled style="opacity:.6;cursor:not-allowed">
        </label>
        <label>Phone Number
          <input id="profPhone" value="${esc(phone)}" placeholder="+91 98765 43210">
        </label>
        <label>Society / Locality
          <input id="profLoc" value="${esc(locality)}" placeholder="e.g. Signature Lake City">
        </label>
        <div style="display:flex;gap:10px;margin-top:6px">
          <button class="btn" id="saveProfBtn">Save Changes</button>
          <button class="btn alt" id="closeProfBtn">Close</button>
        </div>
      </div>
    </div>
  `;
  $('.x').onclick = close;
  $('#closeProfBtn').onclick = close;
  $('#saveProfBtn').onclick = async () => {
    const newName = $('#profName').value.trim();
    const newPhone = $('#profPhone').value.trim();
    const newLoc = $('#profLoc').value.trim();
    if (!newName) return toast('Name cannot be empty');
    
    $('#saveProfBtn').disabled = true;
    $('#saveProfBtn').textContent = 'Saving…';
    
    const updated = {
      ...user,
      name: newName,
      full_name: newName,
      phone: newPhone,
      locality: newLoc
    };
    
    if (sb && user.id) {
      try {
        await sb.from('profiles').upsert({
          id: user.id,
          full_name: newName,
          phone: newPhone,
          locality: newLoc,
          updated_at: new Date().toISOString()
        });
        await sb.auth.updateUser({
          data: { full_name: newName, phone: newPhone, locality: newLoc }
        });
      } catch (err) {
        console.warn('Profile save:', err);
      }
    }
    
    localStorage.setItem('bb_user', JSON.stringify(updated));
    ME.name = newName;
    ME.ph = newPhone;
    ME.blk = newLoc;
    
    close();
    toast('Account details updated in Supabase!');
    renderUserHeader();
    render();
  };
  
  $('#ov').classList.add('on');
}
function openItem(id){
  cur=allItems().find(i=>i.id===id);
  const d=new Date(TODAY*DAY);cm=d.getUTCMonth();cy=d.getUTCFullYear();sel=[];drawModal();$('#ov').classList.add('on');$('#modal').querySelector('.x').focus();
  if(window.BB_TRACK&&cur)BB_TRACK('VIEW_ITEM',{itemId:cur.id,itemName:cur.name,price:cur.p,occ:cur.occ});
}
const close=()=>{$('#ov').classList.remove('on');cur=null};
function drawModal(){const it=cur,n=nbr(it.o);
$('#modal').innerHTML=`<div class="pic">${art(it)}</div><div class="mh"><div><h2>${esc(it.name)}</h2><div class="meta">${esc(it.d)}</div></div><button class="x" aria-label="Close">×</button></div>
<div class="mb"><div><h3>Lender</h3><div class="nbox"><div class="owner" style="border:0;padding:0;margin:0">${avatar(n)}<span><b>${esc(n.name)}</b><br><span class="meta">${esc(n.blk)}</span></span></div>${n.id?`<div class="meta">★ ${n.r.toFixed(1)} · ${n.n} lends · replies in ${esc(n.reply)}</div><a href="tel:${n.ph.replace(/\s/g,'')}">${esc(n.ph)}</a>`:'<div class="meta">This is your own item.</div>'}</div>
<div class='pr' style='margin:8px 0 2px'>${pt(it)}</div><div class='meta' style='margin-bottom:8px'>Paid to the lender directly at pick-up.</div><div class="meta">Lending rule: <b>${it.hrs?'a few hours, same day':`up to ${it.max} day${it.max>1?'s':''}`}</b>. ${it.occ.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}</div>
${n.id?`<div class="f" style="margin-top:12px"><label>Occasion<select id="so">${it.occ.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label></div><div class="sum" id="sum"></div><button class="btn" id="req" style="width:100%">Request to borrow</button>`:''}</div>
<div class="cal"><div class="ch"><button id="pm" aria-label="Previous month">‹</button><h3>${new Date(Date.UTC(cy,cm,1)).toLocaleDateString('en-IN',{month:'long',year:'numeric',timeZone:'UTC'})}</h3><button id="nm" aria-label="Next month">›</button></div><div class="cg">${'SMTWTFS'.split('').map(c=>`<b>${c}</b>`).join('')}${cells()}</div>
<div class="lg"><span><i style="background:var(--teal-s)"></i>Available</span><span><i style="background:var(--rose-s)"></i>Booked</span><span><i style="background:var(--gold-s)"></i>Yours</span><span><i style="background:var(--ink)"></i>Selected</span></div></div></div><div class='rv'>${reviewsHtml(it)}</div>`;
$('.x').onclick=close;$('#pm').onclick=()=>{cm--;if(cm<0){cm=11;cy--}drawModal()};$('#nm').onclick=()=>{cm++;if(cm>11){cm=0;cy++}drawModal()};
document.querySelectorAll('.d[data-n]').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
if($('#req'))$('#req').onclick=request;summary()}
function cells(){const f=new Date(Date.UTC(cy,cm,1)).getUTCDay(),dm=new Date(Date.UTC(cy,cm+1,0)).getUTCDate();let h='<span class="d e"></span>'.repeat(f);
for(let d=1;d<=dm;d++){const n=Math.floor(Date.UTC(cy,cm,d)/DAY),mine=loansFor(cur.id).some(l=>n>=l.s&&n<=l.e);
const inSel=sel.length&&n>=sel[0]&&n<=(sel[1]??sel[0]);
let c='d',dis='';if(n<TODAY){c+=' past';dis='disabled'}else if(mine){c+=' mine';dis='disabled'}else if(isBooked(cur,n)){c+=' bk';dis='disabled'}
if(inSel)c+=' sel';if(n===TODAY)c+=' today';
h+=`<button class="${c}" ${dis} data-n="${n}" aria-label="${fmt(n,{day:'numeric',month:'long'})}">${d}</button>`}return h}
function pick(n){if(cur.o===0)return;
if(sel.length!==1||n<sel[0]){sel=[n]}else{if(n-sel[0]+1>cur.max){toast(`${cur.name} can be borrowed for ${cur.max} days at most`);return}
for(let x=sel[0];x<=n;x++)if(isBooked(cur,x)){toast('Some days in that range are already booked');sel=[n];return drawModal()}
sel=[sel[0],n]}drawModal()}
function summary(){const s=$('#sum');if(!s)return;const r=$('#req');
if(!sel.length){s.textContent='Tap a start date, then an end date.';r.disabled=true}
else if(sel.length===1){s.innerHTML=`Start: <b>${fmt(sel[0])}</b>. ${cur.hrs?'Agree the exact hours with the lender.':'Now tap your return date, or tap the same day for a one-day loan.'} Price: <b>${cost(1)}</b>`;r.disabled=false;r.textContent=cur.hrs?'Request for a few hours':'Request for 1 day'}
else{const dd=sel[1]-sel[0]+1;s.innerHTML=`<b>${fmt(sel[0])}</b> to <b>${fmt(sel[1])}</b> · ${dd} day${dd>1?'s':''}<br>Return by <b>${fmt(sel[1],{weekday:'long',day:'numeric',month:'short'})}</b><br>Total price: <b>${cost(dd)}</b>`;r.disabled=false;r.textContent=`Request for ${dd} days`}}
function request(){
  const s=sel[0],e=sel[1]??sel[0];
  const newLoan = {id:Date.now(),item:cur.id,s,e,occ:$('#so').value,amt:price(cur)*(cur.hrs?1:e-s+1)};
  st.loans.push(newLoan);
  save();
  saveLoanToSupabase(newLoan);
  if(window.BB_TRACK)BB_TRACK('REQUEST_LOAN',{itemId:cur.id,itemName:cur.name,days:(cur.hrs?1:e-s+1),amt:newLoan.amt,occ:$('#so').value});
  close();
  toast(`Requested ${cur.name}. See it under My borrowing.`);
  render()
}
function readImg(f){return new Promise(r=>{if(!f)return r(undefined);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r(undefined);im.src=fr.result};fr.onerror=()=>r(undefined);fr.readAsDataURL(f)})}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)}
document.addEventListener('click',e=>{const f=e.target.closest('.fav');if(!f)return;const id=+f.dataset.f;st.fav=st.fav||[];const i=st.fav.indexOf(id);if(i<0)st.fav.push(id);else st.fav.splice(i,1);save();document.querySelectorAll(`.fav[data-f='${id}']`).forEach(x=>x.classList.toggle('on',i<0));if(view==='browse'&&onlyFav)upd(false);toast(i<0?'Saved to your list':'Removed from saved')});
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};document.onkeydown=e=>{if(e.key==='Escape')close()};
function render(){nav();({browse:renderBrowse,neighbours:renderNb,loans:renderLoans,lend:renderLend})[view]()}
render();
renderUserHeader();
loadFromSupabase();
</script>
